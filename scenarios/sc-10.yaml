# SC-10 — Revival bonus (§15.3 SC-10). The node is dormant at +100 days
# (B = ln(0.1) ≈ -2.303, P ≈ 0.024 < dormantP). Using it gains
# 1 + reviveExtraAccesses = 3 fresh accesses, lifting B to ≈ 3.404
# (ln(3·10 + 0.1054)): no longer dormant.
name: sc-10-revival
nodes:
  - { key: cue, kind: entity, label: Cue, accesses: [0], created: 0 }
  - { key: faded, kind: entity, label: Faded note, accesses: [0], created: 0 }
edges:
  - { from: cue, to: faded, predicate: linked, strength: 1, lastUsed: 0 }
steps:
  - at: 100
    recall: { cues: [cue] }
    use: [faded]
    expect:
      node:
        - { key: faded, active: true, dormant: false, B_gt: 3.3, B_lt: 3.5 }
