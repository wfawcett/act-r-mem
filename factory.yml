# factory.yml: board ids and one command per stage.
# Written by factory:install. Keep to simple "key: value" lines, "- item" lists
# and nested maps. No inline comments.
board:
  repo: wfawcett/act-r-mem
  owner: wfawcett
  project_number: 6
  project_id: PVT_kwHOAETBN84Brzqx
  field_name: Status
  field_id: PVTSSF_lAHOAETBN84BrzqxzhqEmRQ
  options:
    Backlog: f75ad846
    Specify: 45c051c5
    Spec Review: 3d542683
    Ready: 61e4505c
    In progress: 47fc9ee4
    In review: df73e18b
    Approved: 9b1da835
    Done: 98236657
stages:
  - Backlog
  - Specify
  - Spec Review
  - Ready
  - In progress
  - In review
  - Approved
  - Done
labels:
  - BLOCKED
# One command per stage. The factory names none. Pick your own prompt text, for example a slash command.
# allowed_tools is the headless tool list for the stage. The starter list is only a floor: see README.
# Runner and models are config: runner picks the binary (omp), models maps a runner
# to a model or an omp model role (@default, @smol, @slow, @plan).
# Per-stage "models" overrides the top-level map for that stage only.
runner: omp
models:
  omp: "@default"
commands:
  Specify:
    # Placeholders filled by run-phase: {{issue}} {{stage}} {{repo}} {{title}} {{body}}.
    # The ticket text is injected, so a weak model never needs gh to read the card.
    command: |
      Write a short implementation spec for the card below.

      Card title: {{title}}

      Card body:
      {{body}}

      First read the repo: README.md, factory.yml, the source tree. The spec must cover, in this order:
      1. **Goal** - one sentence describing the observable behavior when done.
      2. **Approach** - the files to create or change and the key symbols/types involved. Concrete, no alternatives.
      3. **Verification** - the exact command that proves the behavior (a test, a build, a script run) and what output proves it.
      4. **Out of scope** - anything explicitly not part of this card.

      Write the spec to `specs/{{issue}}-<slug>.md` in the repo root. Keep it under 60 lines. Do not implement anything. Do not run git commands that change state.
    model: "@default"
    max_turns: 15
    allowed_tools:
      - Read
      - Glob
      - Grep
      - Write
  Ready:
    command: |
      Read the spec file for this card under `specs/` (the card is #{{issue}}; the spec file name starts with that number; if several match, take the highest). If none exists, block with the reason "no spec file".

      Produce a short implementation plan as `specs/{{issue}}-plan.md`:
      1. **Task list** - ordered, each item one sentence with the file(s) it touches.
      2. **Types and interfaces** - the exact TypeScript signatures the new code exposes.
      3. **Verification mapping** - for each task, the command from the spec's Verification section that will exercise it.
      4. **Dependencies** - packages to add, if any, with the exact npm install line.

      Do not implement anything. Do not run installers.
    model: "@default"
    max_turns: 20
    allowed_tools:
      - Read
      - Glob
      - Grep
      - Write
  In progress:
    # Task-per-invocation: one bounded session per task. The plan file is the shared
    # memory — the worker reads it, does the NEXT uncompleted task, commits, marks it
    # DONE in the plan, exits. The watcher re-invokes the card automatically (exit 0
    # => immediate re-poll), so the whole plan completes across short sessions and
    # the context window never grows past one task + one diff.
    command: |
      Read the plan file for this card under `specs/` (the card is #{{issue}}; the plan file name starts with that number; if several match, take the highest). If none exists, block with "no plan file".

      Find the FIRST task in the plan's task list that is not already marked "DONE:" in the plan file. Every prior task must have a "DONE:" marker; if the marker for a prior task is missing but the work is verifiably committed on this branch, append the marker and continue. Do not re-implement a task that is already marked DONE.

      Implement ONLY that one task: make the smallest change that satisfies it, then run the task's verification from the plan's Verification mapping (scoped to what that task touches). If it fails, fix and rerun up to 3 times, then block with the failing output.

      Commit the task with a message naming the task number and description.

      Append a line "DONE: <task description>" under that task in the plan file and commit the plan file change too.

      Write result.json and exit. Never implement two tasks in one session. If all tasks are DONE: run the plan's Verification command end to end; if it passes, push the branch to origin and open a PR (body must contain: Closes #{{issue}}) if tools allow, otherwise block with the exact command a person should run. Do not merge. Do not push to main.
    model: "@default"
    max_turns: 25
    allowed_tools:
      - Read
      - Glob
      - Grep
      - Write
      - Edit
      - Bash(git *)
      - Bash(gh pr create *)
poll_seconds: 300
merge:
  auto: true
