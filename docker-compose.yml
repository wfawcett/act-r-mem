# Pinned project name: without it compose derives the project from the working
# directory (repo root -> "act-r-mem", a factory worktree -> "<n>_default"), so
# down/exec from a worktree hits a different container on 5433.
name: act-r-mem

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: recall
      POSTGRES_DB: recall
    volumes:
      - recall-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # Not published: reachable only on the compose network (PRD 16.4)

  test-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: recall
      POSTGRES_DB: recall_test
    ports: ["5433:5432"]
    profiles: ["test"]
    # Ephemeral: no volume, integration tests own it

volumes:
  recall-pgdata:
